name: build

# Compila los .exe de Windows y los deja descargables.
# - En cada push / pull request: artefacto "FileNest-windows" con los dos .exe.
# - Al publicar un Release: los .exe se adjuntan al Release.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Compilar (MinGW / UCRT64)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar MinGW-w64 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make

      - name: Compilar el icono
        run: |
          cd recursos
          windres -O coff -o icono.res.o icono.rc
          cd ..

      - name: Compilar la version consola
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -static \
              -o organizador.exe organizador.cpp recursos/icono.res.o -lshell32

      - name: Compilar la version con ventana
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -municode -mwindows -static \
              -o "Organizador de carpetas.exe" gui.cpp recursos/icono.res.o \
              -lcomctl32 -lole32 -luuid -luxtheme -lshell32

      - name: Comprobar que se han generado
        run: |
          ls -l *.exe

      - name: Crear el instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $cands = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                       "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
                       "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe")
            $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { Write-Host "Inno Setup no disponible: se omite el instalador"; exit 0 }
          & $iscc instalador.iss

      - name: Firmar los .exe (solo si hay certificado en los secretos)
        if: ${{ secrets.SIGNING_PFX != '' }}
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
          SIGNING_PFX_PASS: ${{ secrets.SIGNING_PFX_PASS }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "firma.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          $sec = ConvertTo-SecureString -String $env:SIGNING_PFX_PASS -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $sec
          Get-ChildItem -Filter *.exe | ForEach-Object {
            Set-AuthenticodeSignature -FilePath $_.FullName -Certificate $cert `
              -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com" | Out-Null
            Write-Host ("Firmado: " + $_.Name)
          }
          Get-ChildItem -Path salida -Filter *.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Set-AuthenticodeSignature -FilePath $_.FullName -Certificate $cert `
              -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com" | Out-Null
            Write-Host ("Firmado: " + $_.Name)
          }

      - name: Subir los .exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FileNest-windows
          path: |
            organizador.exe
            Organizador de carpetas.exe
            salida/FileNet-*-instalador.exe
          if-no-files-found: error

      - name: Adjuntar los .exe al Release (solo al publicar un tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            organizador.exe
            Organizador de carpetas.exe
            salida/FileNet-*-instalador.exe
          generate_release_notes: true
