name: build

# Compila FileNest (C# / .NET 8), ejecuta las pruebas, crea el instalador y lo
# deja descargable:
#   - En cada push / pull request: artefacto "FileNest-windows".
#   - Al publicar una etiqueta v*: ademas crea/actualiza el Release.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  windows:
    name: Compilar (.NET 8 / WPF)
    runs-on: windows-latest

    # Los secretos se leen aqui (en un 'if' no se pueden usar directamente)
    env:
      SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
      SIGNING_PFX_PASS: ${{ secrets.SIGNING_PFX_PASS }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar el SDK de .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pruebas del motor
        run: dotnet test tests/FileNest.Tests/FileNest.Tests.csproj -c Release --nologo

      - name: Publicar la version consola (organizador.exe)
        run: >
          dotnet publish src/FileNest.Cli/FileNest.Cli.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o publish --nologo

      - name: Publicar la version ventana (Organizador de carpetas.exe)
        run: >
          dotnet publish src/FileNest.App/FileNest.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o publish --nologo

      - name: Copiar el lanzador y el README
        shell: pwsh
        run: |
          Copy-Item Organizador.bat, README.md -Destination publish
          Remove-Item publish\*.pdb -ErrorAction SilentlyContinue
          Get-ChildItem publish | Select-Object Name, Length

      - name: Crear el instalador (Inno Setup)
        shell: pwsh
        run: |
          $cands = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                     "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
                     "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe")
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          if (-not $iscc) {
            Write-Host "Inno Setup no encontrado: instalando..."
            choco install innosetup --no-progress -y
            $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { Write-Host "AVISO: sin Inno Setup, se omite el instalador"; exit 0 }

          $ver = (Select-Xml -Path Directory.Build.props -XPath '/*/*/Version').Node.InnerText
          Write-Host "Usando: $iscc  (version $ver)"
          & $iscc "/DMiVersion=$ver" instalador.iss
          Get-ChildItem salida -ErrorAction SilentlyContinue

      - name: Firmar los .exe (solo si hay certificado en los secretos)
        if: ${{ env.SIGNING_PFX != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "firma.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          $sec = ConvertTo-SecureString -String $env:SIGNING_PFX_PASS -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $sec

          $lista = @(Get-ChildItem -Path publish -Filter *.exe)
          $lista += @(Get-ChildItem -Path salida -Filter *.exe -ErrorAction SilentlyContinue)
          foreach ($f in $lista) {
            Set-AuthenticodeSignature -FilePath $f.FullName -Certificate $cert `
              -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com" | Out-Null
            Write-Host ("Firmado: " + $f.Name)
          }

      - name: Subir los archivos como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FileNest-windows
          path: |
            publish/Organizador de carpetas.exe
            publish/organizador.exe
            publish/Organizador.bat
            salida/FileNest-*-instalador.exe
          if-no-files-found: warn

      - name: Adjuntar los archivos al Release (solo al publicar una etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Organizador de carpetas.exe
            publish/organizador.exe
            salida/FileNest-*-instalador.exe
          generate_release_notes: true
